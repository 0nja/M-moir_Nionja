<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Settings Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#E8E8ED; display:flex; align-items:center; justify-content:center; height:100vh; }

        .window { width:820px; height:540px; background:#F2F2F7; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.3); display:flex; overflow:hidden; }

        /* SIDEBAR */
        .sidebar { width:220px; min-width:220px; background:#E5E5EA; border-right:1px solid #D1D1D6; display:flex; flex-direction:column; padding:0; }
        .win-head { padding:14px 16px 10px; border-bottom:1px solid #D1D1D6; }
        .tls { display:flex; gap:7px; margin-bottom:14px; }
        .tl { width:12px; height:12px; border-radius:50%; cursor:pointer; }
        .tl.r { background:#FF5F57; } .tl.y { background:#FFBD2E; } .tl.g { background:#28C840; }
        .search { display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.7); border-radius:8px; padding:6px 10px; }
        .search i { color:#aaa; font-size:11px; }
        .search input { border:none; background:transparent; font-size:12px; outline:none; color:#333; width:100%; }
        .sb-nav { flex:1; overflow-y:auto; padding:8px; }
        .sb-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px; cursor:pointer; font-size:13px; color:#333; text-decoration:none; }
        .sb-item:hover { background:rgba(0,0,0,0.06); }
        .sb-item.active { background:#007AFF; color:#fff; }
        .sb-item.active .sb-ico { filter:brightness(0) invert(1); }
        .sb-ico { width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; }

        /* MAIN */
        .main { flex:1; background:#F2F2F7; overflow-y:auto; }
        .main-head { padding:20px 24px 0; }
        .main-title { font-size:20px; font-weight:700; color:#000; margin-bottom:20px; }
        .section { background:#fff; border-radius:10px; margin:0 16px 16px; overflow:hidden; border:1px solid #D1D1D6; }
        .section-row { display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid #F0F0F0; }
        .section-row:last-child { border-bottom:none; }
        .row-icon { width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0; margin-right:12px; }
        .row-label { flex:1; font-size:13.5px; color:#000; }
        .row-value { font-size:13px; color:#8E8E93; margin-right:8px; }
        .row-arrow { color:#C7C7CC; font-size:12px; }
        /* Toggle */
        .toggle { width:40px; height:24px; border-radius:12px; background:#E5E5EA; position:relative; cursor:pointer; transition:.2s; flex-shrink:0; }
        .toggle.on { background:#34C759; }
        .toggle::after { content:''; position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; top:2px; left:2px; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
        .toggle.on::after { left:18px; }
    </style>
</head>
<body>
    <div class="window">
        <aside class="sidebar">
            <div class="win-head">
                <div class="tls"><div class="tl r"></div><div class="tl y"></div><div class="tl g"></div></div>
                <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Rechercher..."></div>
            </div>
            <div class="sb-nav">
                <a class="sb-item" href="#"><div class="sb-ico" style="background:#5E5CE6;color:#fff;"><i class="fa-solid fa-user"></i></div>Profil</a>
                <a class="sb-item active" href="#"><div class="sb-ico" style="background:#FF9F0A;color:#fff;"><i class="fa-solid fa-bell"></i></div>Notifications</a>
                <a class="sb-item" href="#"><div class="sb-ico" style="background:#007AFF;color:#fff;"><i class="fa-solid fa-wifi"></i></div>Réseau</a>
                <a class="sb-item" href="#"><div class="sb-ico" style="background:#30D158;color:#fff;"><i class="fa-solid fa-battery-full"></i></div>Batterie</a>
                <a class="sb-item" href="#"><div class="sb-ico" style="background:#FF2D55;color:#fff;"><i class="fa-solid fa-lock"></i></div>Confidentialité</a>
                <a class="sb-item" href="#"><div class="sb-ico" style="background:#555;color:#fff;"><i class="fa-solid fa-desktop"></i></div>Affichage</a>
                <a class="sb-item" href="#"><div class="sb-ico" style="background:#0A84FF;color:#fff;"><i class="fa-solid fa-keyboard"></i></div>Clavier</a>
                <a class="sb-item" href="#"><div class="sb-ico" style="background:#FF6B35;color:#fff;"><i class="fa-solid fa-gear"></i></div>Général</a>
            </div>
        </aside>

        <div class="main">
            <div class="main-head">
                <div class="main-title"><i class="fa-solid fa-bell" style="color:#FF9F0A;margin-right:10px;"></i>Notifications</div>
            </div>

            <div class="section">
                <div class="section-row">
                    <div class="row-icon" style="background:#FF9F0A10;"><i class="fa-solid fa-bell" style="color:#FF9F0A;"></i></div>
                    <div class="row-label">Autoriser les notifications</div>
                    <div class="toggle on"></div>
                </div>
                <div class="section-row">
                    <div class="row-icon" style="background:#007AFF10;"><i class="fa-solid fa-volume-high" style="color:#007AFF;"></i></div>
                    <div class="row-label">Sons de notification</div>
                    <div class="toggle on"></div>
                </div>
                <div class="section-row">
                    <div class="row-icon" style="background:#5E5CE610;"><i class="fa-solid fa-eye" style="color:#5E5CE6;"></i></div>
                    <div class="row-label">Aperçus</div>
                    <div class="row-value">Toujours</div>
                    <div class="row-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                </div>
            </div>

            <div class="section" style="margin-top:0;">
                <div class="section-row">
                    <div class="row-icon" style="background:#30D15810;"><i class="fa-solid fa-comment" style="color:#30D158;"></i></div>
                    <div class="row-label">Messages</div>
                    <div class="toggle on"></div>
                </div>
                <div class="section-row">
                    <div class="row-icon" style="background:#FF2D5510;"><i class="fa-solid fa-envelope" style="color:#FF2D55;"></i></div>
                    <div class="row-label">Mail</div>
                    <div class="toggle"></div>
                </div>
                <div class="section-row">
                    <div class="row-icon" style="background:#0A84FF10;"><i class="fa-brands fa-slack" style="color:#0A84FF;"></i></div>
                    <div class="row-label">Slack</div>
                    <div class="toggle on"></div>
                </div>
                <div class="section-row">
                    <div class="row-icon" style="background:#FF9F0A10;"><i class="fa-solid fa-calendar" style="color:#FF9F0A;"></i></div>
                    <div class="row-label">Calendrier</div>
                    <div class="row-value">Badges seulement</div>
                    <div class="row-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
