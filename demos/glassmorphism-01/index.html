<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="app-container">
        <nav class="glass-panel nav">
            <div class="logo">Glass<span>UI</span></div>
            <div class="nav-links">
                <a href="#">Dashboard</a>
                <a href="#">Wallet</a>
                <a href="#">Settings</a>
            </div>
            <button class="glass-btn">Connect</button>
        </nav>

        <main class="main-content">
            <div class="hero">
                <h1 class="gradient-text">The Future of Finance</h1>
                <p>Manage your crypto assets with elegant simplicity and uncompromised security.</p>
                <div class="hero-actions">
                    <button class="glass-btn primary">Get Started</button>
                </div>
            </div>

            <div class="bento-grid">
                <div class="glass-panel card balance-card">
                    <h3>Total Balance</h3>
                    <div class="balance">$124,592.00</div>
                    <div class="trend positive">+12.5% this week</div>
                </div>
                
                <div class="glass-panel card quick-transfer">
                    <h3>Quick Transfer</h3>
                    <div class="user-avatars">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80" class="avatar" alt="User">
                        <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=100&q=80" class="avatar" alt="User">
                        <div class="avatar add">+</div>
                    </div>
                </div>

                <div class="glass-panel card graph-card">
                    <h3>Activity</h3>
                    <div class="graph-placeholder">
                        <div class="bar" style="height: 40%"></div>
                        <div class="bar" style="height: 70%"></div>
                        <div class="bar" style="height: 50%"></div>
                        <div class="bar" style="height: 90%"></div>
                        <div class="bar" style="height: 60%"></div>
                        <div class="bar" style="height: 100%"></div>
                        <div class="bar" style="height: 30%"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
