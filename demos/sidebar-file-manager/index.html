<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>File Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#F2F2F7; color:#000; display:flex; flex-direction:column; height:100vh; overflow:hidden; }

        /* TOOLBAR haut (macOS style) */
        .toolbar { height:44px; background:#EBEBEB; border-bottom:1px solid #D1D1D6; display:flex; align-items:center; padding:0 16px; gap:12px; flex-shrink:0; }
        .tls { display:flex; gap:7px; }
        .tl { width:13px; height:13px; border-radius:50%; cursor:pointer; }
        .tl.r { background:#FF5F57; } .tl.y { background:#FFBD2E; } .tl.g { background:#28C840; }
        .toolbar-sep { width:1px; height:20px; background:#D1D1D6; margin:0 4px; }
        .tb-btn { width:28px; height:28px; border-radius:6px; background:none; border:none; color:#555; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; }
        .tb-btn:hover { background:rgba(0,0,0,0.08); }
        .tb-path { flex:1; text-align:center; font-size:13px; font-weight:500; color:#333; }
        .search-bar { display:flex; align-items:center; gap:6px; background:rgba(0,0,0,0.07); border-radius:8px; padding:5px 10px; }
        .search-bar i { color:#888; font-size:12px; }
        .search-bar input { border:none; background:transparent; font-size:12px; outline:none; width:120px; color:#333; }

        /* BODY */
        .body { flex:1; display:flex; overflow:hidden; }

        /* SIDEBAR */
        .sidebar { width:190px; min-width:190px; background:#F2F2F7; border-right:1px solid #D1D1D6; padding:8px 0; overflow-y:auto; }
        .sb-section { margin-bottom:16px; }
        .sb-label { font-size:11px; font-weight:600; color:#8E8E93; text-transform:uppercase; letter-spacing:.7px; padding:0 12px 6px; }
        .sb-item { display:flex; align-items:center; gap:8px; padding:6px 12px; cursor:pointer; border-radius:0; font-size:13px; color:#333; text-decoration:none; }
        .sb-item:hover { background:rgba(0,0,0,0.04); }
        .sb-item.active { background:#007AFF; color:#fff; border-radius:0; }
        .sb-item.active i { color:#fff; }
        .sb-item i { width:16px; text-align:center; font-size:13px; color:#007AFF; }

        /* MAIN */
        .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
        .view-bar { height:38px; padding:0 16px; display:flex; align-items:center; gap:8px; border-bottom:1px solid #D1D1D6; background:#fff; flex-shrink:0; }
        .view-btn { width:28px; height:28px; border:none; background:none; cursor:pointer; color:#888; font-size:13px; display:flex; align-items:center; justify-content:center; border-radius:5px; }
        .view-btn.active { background:#007AFF; color:#fff; }
        .view-sep { flex:1; }
        .sort-select { font-size:12px; color:#555; border:none; background:transparent; outline:none; cursor:pointer; }

        .grid { flex:1; padding:20px; display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:16px; align-content:start; overflow-y:auto; background:#fff; }
        .file-item { display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 8px; border-radius:10px; cursor:pointer; text-align:center; }
        .file-item:hover { background:#F2F2F7; }
        .file-item.selected { background:#EAF1FF; }
        .file-icon { font-size:36px; line-height:1; }
        .file-name { font-size:11px; color:#333; line-height:1.3; word-break:break-word; }

        /* STATUS BAR */
        .status-bar { height:24px; background:#EBEBEB; border-top:1px solid #D1D1D6; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .status-bar span { font-size:11px; color:#8E8E93; }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="tls"><div class="tl r"></div><div class="tl y"></div><div class="tl g"></div></div>
        <div class="toolbar-sep"></div>
        <button class="tb-btn"><i class="fa-solid fa-chevron-left"></i></button>
        <button class="tb-btn"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="toolbar-sep"></div>
        <button class="tb-btn"><i class="fa-solid fa-arrow-up"></i></button>
        <div class="tb-path">Documents / Projets / Design</div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Rechercher">
        </div>
    </div>

    <div class="body">
        <aside class="sidebar">
            <div class="sb-section">
                <div class="sb-label">Favoris</div>
                <a class="sb-item active" href="#"><i class="fa-solid fa-house"></i> Bureau</a>
                <a class="sb-item" href="#"><i class="fa-solid fa-folder"></i> Documents</a>
                <a class="sb-item" href="#"><i class="fa-solid fa-download"></i> Téléchargements</a>
                <a class="sb-item" href="#"><i class="fa-solid fa-image"></i> Images</a>
            </div>
            <div class="sb-section">
                <div class="sb-label">Emplacements</div>
                <a class="sb-item" href="#"><i class="fa-solid fa-computer"></i> Mon Mac</a>
                <a class="sb-item" href="#"><i class="fa-brands fa-dropbox"></i> Dropbox</a>
                <a class="sb-item" href="#"><i class="fa-brands fa-google-drive"></i> Google Drive</a>
            </div>
            <div class="sb-section">
                <div class="sb-label">Tags</div>
                <a class="sb-item" href="#"><i class="fa-solid fa-circle" style="color:#FF3B30;font-size:9px;"></i> Urgent</a>
                <a class="sb-item" href="#"><i class="fa-solid fa-circle" style="color:#30D158;font-size:9px;"></i> Terminé</a>
                <a class="sb-item" href="#"><i class="fa-solid fa-circle" style="color:#007AFF;font-size:9px;"></i> En cours</a>
            </div>
        </aside>

        <div class="main">
            <div class="view-bar">
                <button class="view-btn active"><i class="fa-solid fa-th-large"></i></button>
                <button class="view-btn"><i class="fa-solid fa-list"></i></button>
                <div class="view-sep"></div>
                <select class="sort-select"><option>Nom</option><option>Date</option><option>Taille</option></select>
            </div>

            <div class="grid">
                <div class="file-item">
                    <div class="file-icon" style="color:#007AFF"><i class="fa-solid fa-folder"></i></div>
                    <div class="file-name">DesignHub</div>
                </div>
                <div class="file-item">
                    <div class="file-icon" style="color:#007AFF"><i class="fa-solid fa-folder"></i></div>
                    <div class="file-name">Assets</div>
                </div>
                <div class="file-item selected">
                    <div class="file-icon" style="color:#007AFF"><i class="fa-solid fa-folder"></i></div>
                    <div class="file-name">Maquettes</div>
                </div>
                <div class="file-item">
                    <div class="file-icon" style="color:#5E5CE6"><i class="fa-solid fa-file-code"></i></div>
                    <div class="file-name">app.js</div>
                </div>
                <div class="file-item">
                    <div class="file-icon" style="color:#FF9F0A"><i class="fa-solid fa-file-image"></i></div>
                    <div class="file-name">hero.png</div>
                </div>
                <div class="file-item">
                    <div class="file-icon" style="color:#FF3B30"><i class="fa-solid fa-file-pdf"></i></div>
                    <div class="file-name">cahier.pdf</div>
                </div>
                <div class="file-item">
                    <div class="file-icon" style="color:#30D158"><i class="fa-solid fa-file-excel"></i></div>
                    <div class="file-name">budget.xlsx</div>
                </div>
                <div class="file-item">
                    <div class="file-icon" style="color:#555"><i class="fa-solid fa-file-zipper"></i></div>
                    <div class="file-name">archive.zip</div>
                </div>
                <div class="file-item">
                    <div class="file-icon" style="color:#007AFF"><i class="fa-solid fa-folder"></i></div>
                    <div class="file-name">Exports</div>
                </div>
            </div>
        </div>
    </div>

    <div class="status-bar"><span>9 éléments · 2 sélectionnés · 48 Mo disponibles</span></div>
</body>
</html>
